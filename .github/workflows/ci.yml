name: firmware-ci

on:
  push:
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: recursive
      - name: Framework tests
        run: |
          cmake -S external/agile-firmware-framework -B external/agile-firmware-framework/build
          cmake --build external/agile-firmware-framework/build
          ctest --test-dir external/agile-firmware-framework/build --output-on-failure
      - name: Product tests and architecture gates
        run: |
          cmake -S tests/host -B tests/host/build
          cmake --build tests/host/build
          ctest --test-dir tests/host/build --output-on-failure

  esp-idf-build:
    runs-on: ubuntu-latest
    container: espressif/idf:v6.0.2
    strategy:
      fail-fast: false
      matrix:
        profile: [local_switch, gateway_node]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: recursive
      - name: Build ESP32-C6 profile
        shell: bash
        run: |
          idf.py set-target esp32c6
          idf.py reconfigure -DPRODUCT_PROFILE=${{ matrix.profile }}
          idf.py build
          test -f build/compile_commands.json
          idf.py size

  matter-node-build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: recursive
      - name: Checkout pinned ESP-Matter
        shell: bash
        run: |
          git clone --branch release/v1.6 --depth 1 https://github.com/espressif/esp-matter.git /opt/esp/esp-matter
          test "$(git -C /opt/esp/esp-matter rev-parse HEAD)" = "c91ddfbb08ccc74bb73dd6eca7422178f48b75e1"
          git -C /opt/esp/esp-matter submodule update --init --depth 1
          python3 /opt/esp/esp-matter/connectedhomeip/connectedhomeip/scripts/checkout_submodules.py --platform esp32 --shallow
          /opt/esp/esp-matter/install.sh --no-host-tool
          python -m pip install -r /opt/esp/esp-matter/requirements.txt
      - name: Build Matter-over-Thread node
        shell: bash
        env:
          PROJECT_DIR: ${{ github.workspace }}
          BUILD_DIR: ${{ github.workspace }}/build-matter-node
          ESP_MATTER_PATH: /opt/esp/esp-matter
        run: |
          bash tools/build_matter_node.sh
          test -f build-matter-node/compile_commands.json
          if grep -a -q "home/control" build-matter-node/agile_smart_device.bin; then
            echo "Matter node binary contains Gateway MQTT topics" >&2
            exit 1
          fi
          if grep -a -q "request_id" build-matter-node/agile_smart_device.bin; then
            echo "Matter node binary contains Gateway correlation fields" >&2
            exit 1
          fi
          idf.py -B build-matter-node size
